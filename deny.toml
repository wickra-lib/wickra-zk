# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).

[advisories]
version = 2
yanked = "deny"
# Suppressed advisories (assessed as not affecting wickra-zk). Keep in
# lock-step with osv-scanner.toml.
ignore = [
  # bincode 1.3.3, unmaintained. Not a vulnerability: the team ceased
  # development after a harassment incident and considers 1.3.3 complete. It
  # reaches us only as risc0-zkvm's serialisation format --
  #   bincode 1.3.3 <- risc0-zkvm 3.0.6 <- wickra-zk-host
  # -- so it is not ours to replace, and there is no patched version to move
  # to. Revisit when risc0 changes serialiser; until then this is a fact about
  # a dependency, not a finding about this repository.
  "RUSTSEC-2025-0141",
  # tracing-subscriber 0.2.25, CVE-2025-58160 / GHSA-xwfj-jgwm-7wp5: log output
  # can be poisoned with ANSI escape sequences when user input reaches a log
  # line. The fix is 0.3.20, and the 0.3 line is not reachable from here --
  #   tracing-subscriber 0.2.25 <- ark-relations 0.5.1 <- ark-crypto-primitives
  #   <- ark-groth16 <- risc0-groth16 <- risc0-zkvm <- wickra-zk-host
  # -- because ark-relations declares the 0.2 line. Nothing in this repository
  # logs untrusted input through that subscriber either: it is pulled in by
  # risc0's groth16 path, which this crate does not drive. Revisit when
  # ark-relations moves.
  "RUSTSEC-2025-0055",
  # rsa 0.9.10, RUSTSEC-2023-0071 / GHSA-4grx-2x9w-596c, the Marvin attack: a
  # timing side channel in RSA decryption can leak the private key. No patched
  # release exists (the 0.10 line is unreleased). It arrives with risc0 --
  #   rsa 0.9.10 <- rzup 0.5.2 <- risc0-build 3.0.6 <- risc0-zkvm 3.0.6
  #   <- wickra-zk-host
  # -- where rzup verifies the signature on a toolchain it downloads. This
  # repository never calls into it (the guest is committed, not built at host
  # build time), no private key is ever held, and the only operation rsa
  # performs anywhere in the graph is signature verification on public data.
  # Revisit when rsa 0.10 is released and rzup moves.
  "RUSTSEC-2023-0071",
  # derivative 2.2.0, unmaintained (RUSTSEC-2024-0388). A proc-macro crate that
  # runs at compile time and ships no code of its own into the binary --
  #   derivative <- ark-crypto-primitives <- ark-groth16 <- risc0-groth16
  #   <- risc0-zkvm <- wickra-zk-host
  # -- on risc0's groth16 path, which this crate does not drive. Not ours to
  # replace; revisit when arkworks moves.
  "RUSTSEC-2024-0388",
  # paste 1.0.15, unmaintained (RUSTSEC-2024-0436). The same shape: a
  # compile-time proc-macro --
  #   paste <- ark-ff <- ark-bn254 <- risc0-groth16 <- risc0-zkvm <- wickra-zk-host
  # -- that ships nothing into the binary and arrives with risc0's groth16
  # path. Revisit when arkworks moves.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

# Scoped license exceptions for individual permissive / public-domain crates
# pulled in transitively by the risc0 zkVM stack:
#   - webpki-roots (CDLA-Permissive-2.0): the Mozilla CA certificate bundle as
#     data, pulled in via risc0's networked prover client.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The deterministic engine, canonicalization/hash and CSV facade are consumed as
# git dependencies until their first crates.io release; they live under the
# project's own GitHub org.
[sources.allow-org]
github = ["wickra-lib"]
