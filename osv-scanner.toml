# OSV-Scanner suppressions (VEX record). Consumed by OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check. Each entry would be an advisory
# assessed as not affecting wickra-zk; this mirrors the cargo-deny `ignore`
# list in deny.toml at the OSV layer.
#
# Keep in lock-step with deny.toml's [advisories].ignore.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 is unmaintained, not vulnerable: development ceased after a harassment incident and the team considers 1.3.3 complete. It reaches wickra-zk only as risc0-zkvm's serialisation format (bincode <- risc0-zkvm <- wickra-zk-host), so it is not ours to replace and no patched version exists. Revisit when risc0 changes serialiser."

[[IgnoredVulns]]
id = "GHSA-xwfj-jgwm-7wp5"
reason = "tracing-subscriber 0.2.25 (CVE-2025-58160): ANSI escape sequences can poison log output when untrusted input reaches a log line. Fixed in 0.3.20, which is unreachable here: ark-relations 0.5.1 declares the 0.2 line, and the chain is ark-relations <- ark-crypto-primitives <- ark-groth16 <- risc0-groth16 <- risc0-zkvm. Nothing in wickra-zk logs untrusted input through that subscriber; it arrives with risc0's groth16 path, which this crate does not drive. Revisit when ark-relations moves."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa 0.9.10 (GHSA-4grx-2x9w-596c, Marvin attack): a timing side channel in RSA decryption can leak the private key; no patched release exists. It arrives with risc0 (rsa <- rzup <- risc0-build <- risc0-zkvm <- wickra-zk-host), where rzup verifies the signature on a toolchain it downloads. wickra-zk never calls into it (the guest is committed, not built at host build time), no private key is ever held, and the only operation rsa performs anywhere in the graph is signature verification on public data. Revisit when rsa 0.10 is released and rzup moves."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
reason = "derivative 2.2.0 is unmaintained, not vulnerable: a compile-time proc-macro that ships no code into the binary. It arrives on risc0's groth16 path (derivative <- ark-crypto-primitives <- ark-groth16 <- risc0-groth16 <- risc0-zkvm), which wickra-zk does not drive, and is not ours to replace. Revisit when arkworks moves."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste 1.0.15 is unmaintained, not vulnerable: a compile-time proc-macro that ships no code into the binary. It arrives on risc0's groth16 path (paste <- ark-ff <- ark-bn254 <- risc0-groth16 <- risc0-zkvm), which wickra-zk does not drive, and is not ours to replace. Revisit when arkworks moves."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
reason = "atomic-polyfill 1.0.3 is unmaintained, not vulnerable: a compile-time polyfill for atomics on targets without them, a no-op on every target wickra-zk builds. It arrives with risc0's in-process prover (atomic-polyfill <- heapless 0.7 <- postcard <- risc0-binfmt <- risc0-zkvm); heapless 0.8 dropped it and is unreachable while postcard declares the 0.7 line. Revisit when postcard moves."
