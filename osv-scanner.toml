# OSV-Scanner suppressions (VEX record). Consumed by OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check. Each entry would be an advisory
# assessed as not affecting wickra-zk; this mirrors the cargo-deny `ignore`
# list in deny.toml at the OSV layer.
#
# Keep in lock-step with deny.toml's [advisories].ignore.

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 is unmaintained, not vulnerable: development ceased after a harassment incident and the team considers 1.3.3 complete. It reaches wickra-zk only as risc0-zkvm's serialisation format (bincode <- risc0-zkvm <- wickra-zk-host), so it is not ours to replace and no patched version exists. Revisit when risc0 changes serialiser."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0055"
reason = "tracing-subscriber 0.2.25 (GHSA-xwfj-jgwm-7wp5, CVE-2025-58160): ANSI escape sequences can poison log output when untrusted input reaches a log line. Fixed in 0.3.20, which is unreachable here: ark-relations 0.5.1 declares the 0.2 line, and the chain is ark-relations <- ark-crypto-primitives <- ark-groth16 <- risc0-groth16 <- risc0-zkvm. Nothing in wickra-zk logs untrusted input through that subscriber; it arrives with risc0's groth16 path, which this crate does not drive. Revisit when ark-relations moves."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa 0.9.10 (GHSA-4grx-2x9w-596c, Marvin attack): a timing side channel in RSA decryption can leak the private key; no patched release exists. It arrives with risc0 (rsa <- rzup <- risc0-build <- risc0-zkvm <- wickra-zk-host), where rzup verifies the signature on a toolchain it downloads. wickra-zk never calls into it (the guest is committed, not built at host build time), no private key is ever held, and the only operation rsa performs anywhere in the graph is signature verification on public data. Revisit when rsa 0.10 is released and rzup moves."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
reason = "derivative 2.2.0 is unmaintained, not vulnerable: a compile-time proc-macro that ships no code into the binary. It arrives on risc0's groth16 path (derivative <- ark-crypto-primitives <- ark-groth16 <- risc0-groth16 <- risc0-zkvm), which wickra-zk does not drive, and is not ours to replace. Revisit when arkworks moves."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste 1.0.15 is unmaintained, not vulnerable: a compile-time proc-macro that ships no code into the binary. It arrives on risc0's groth16 path (paste <- ark-ff <- ark-bn254 <- risc0-groth16 <- risc0-zkvm), which wickra-zk does not drive, and is not ours to replace. Revisit when arkworks moves."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
reason = "atomic-polyfill 1.0.3 is unmaintained, not vulnerable: a compile-time polyfill for atomics on targets without them, a no-op on every target wickra-zk builds. It arrives with risc0's in-process prover (atomic-polyfill <- heapless 0.7 <- postcard <- risc0-binfmt <- risc0-zkvm); heapless 0.8 dropped it and is unreachable while postcard declares the 0.7 line. Revisit when postcard moves."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0344"
reason = "ruzstd 0.7.3: a tiny zstd input can exhaust memory. Fixed in 0.9.1, unreachable while risc0-zkvm 3.0.6 declares object ^0.36 (ruzstd <- object 0.36.7 <- risc0-zkvm <- wickra-zk-host). object only runs in risc0's profiler, which is built only when RISC0_PPROF_OUT is set and then parses the committed guest ELF, never input from outside. Revisit when risc0 moves."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
reason = "zip 2.4.2 (GHSA-vv5m-jxxh-4627): ZipArchive::extract preserves SUID/SGID bits. Fixed in 9.0.0, unreachable while risc0-circuit-recursion 4.0.5 declares zip ^2.1 (zip <- risc0-circuit-recursion <- risc0-zkvm <- wickra-zk-host). Nothing extracts to disk: risc0 opens its own embedded recursion_zkr.zip and reads entries into memory with by_name + read_exact. Revisit when risc0 moves."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
reason = "zip 2.4.2 (GHSA-4v9h-p7m9-rh26): ZipArchive::extract creates symlinks whose targets leave the destination directory. Fixed in 9.0.0, unreachable while risc0-circuit-recursion 4.0.5 declares zip ^2.1. Nothing extracts to disk: risc0 opens its own embedded recursion_zkr.zip and reads entries into memory with by_name + read_exact. Revisit when risc0 moves."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
reason = "zip 2.4.2 (GHSA-4684-h2q9-2vcp): ZipStreamReader::extract and ZipArchive::extract apply Unix permissions through symlinks. Fixed in 9.0.0, unreachable while risc0-circuit-recursion 4.0.5 declares zip ^2.1. Nothing extracts to disk: risc0 opens its own embedded recursion_zkr.zip and reads entries into memory with by_name + read_exact. Revisit when risc0 moves."

# The three zip advisories below have no RustSec record, so cargo-deny does not
# report them and deny.toml carries no counterpart.
[[IgnoredVulns]]
id = "GHSA-m665-v7pm-7grj"
reason = "zip 2.4.2 (CVE-2026-115905): ZipArchive takes entry names from the central directory and ZipStreamReader from the local headers, so one archive can name different files to each and an extraction can overwrite files the other reader never listed. Fixed in 9.0.5, unreachable while risc0-circuit-recursion 4.0.5 declares zip ^2.1. Neither half of the differential is reachable: risc0 never uses ZipStreamReader and never extracts, it opens its own recursion_zkr.zip (include_bytes!, sha256-pinned in its build.rs) with ZipArchive and reads entries into memory with by_name + read_exact. Revisit when risc0 moves."

[[IgnoredVulns]]
id = "GHSA-8hxf-qr8p-62x4"
reason = "zip 2.4.2 (CVE-2026-115906): an AES-encrypted entry truncated before its declared compressed size is returned without its HMAC being checked. Fixed in 9.0.0, unreachable while risc0-circuit-recursion 4.0.5 declares zip ^2.1. The AES reader is not compiled: risc0 builds zip with default-features off and only deflate, so aes-crypto is off (zip is locked only in the root Cargo.lock, with no aes dependency), and the one archive it reads is its own embedded, unencrypted recursion_zkr.zip. Revisit when risc0 moves."

[[IgnoredVulns]]
id = "GHSA-q7v9-x93c-xqv3"
reason = "zip 2.4.2 (CVE-2026-115909): ZipArchive::extract allocates a symlink target buffer of the size the archive declares, so a tiny archive can abort the process or exhaust memory. Fixed in 9.0.0, unreachable while risc0-circuit-recursion 4.0.5 declares zip ^2.1. Nothing extracts: risc0 opens its own embedded recursion_zkr.zip and reads entries into memory with by_name + read_exact. Revisit when risc0 moves."

# GHSA-qwgh-2vcv-g2f7 has no RustSec record, so cargo-deny does not report it
# and deny.toml carries no counterpart.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10.4: a panic caught inside a compress or block-generator callback can leave EagerBuffer or ReadBuffer with an invalid cursor, so later use reads or writes out of bounds. Fixed in 0.12.1, unreachable while risc0 and arkworks declare the digest 0.10 line (block-buffer <- digest 0.10 <- sha2 0.10 / blake2 0.10 <- risc0-zkp, risc0-zkvm, ark-crypto-primitives), in all four lockfiles. Reaching it takes a compression function that panics mid-block and a caller that catches the panic and keeps hashing with the same state: the sha2 and blake2 compression functions do not panic, the one catch_unwind in wickra-zk (the C ABI around command_json) drops everything it ran instead of reusing it, and in the guest a panic ends the zkVM session. Revisit when risc0 moves."
