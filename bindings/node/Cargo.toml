[package]
name = "wickra-zk-node"
description = "Node.js bindings for wickra-zk: prove a backtest in zero knowledge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib"]

# Mirrors [workspace.lints] clippy set. napi-derive emits its own guarded unsafe;
# the crate re-allows unsafe locally (the workspace forbids it everywhere else).
# Cargo passes the workspace `forbid` on the command line, and the macro's
# `allow` cannot overrule that (E0453), so the crate must not inherit it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dependencies]
wickra-zk-host = { path = "../../crates/wickra-zk-host", version = "0.1.0" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
