[package]
name = "wickra-zk-python"
description = "Python bindings for wickra-zk: prove a backtest in zero knowledge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "_wickra_zk"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
wickra-zk-host = { path = "../../crates/wickra-zk-host", version = "0.1.0" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
