[package]
name = "wickra-zk-host"
description = "Prover and verifier for wickra-zk: runs the deterministic wickra-backtest inside a risc0 zkVM guest and turns a receipt into a trustless, data-hiding proof of backtest performance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# docs.rs builds with default features unless told otherwise, so anything behind
# a feature flag is missing from the rendered documentation -- silently, because
# the build still succeeds.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
risc0-zkvm = { workspace = true }
wickra-zk-methods = { path = "../../guest/methods", version = "0.1.0" }
wickra-backtest = { workspace = true }
proof-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
