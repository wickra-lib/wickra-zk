[package]
name = "wickra-zk-host"
description = "Prover and verifier for wickra-zk: runs the deterministic wickra-backtest inside a risc0 zkVM guest and turns a receipt into a trustless, data-hiding proof of backtest performance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# docs.rs builds with default features unless told otherwise, so anything behind
# a feature flag is missing from the rendered documentation -- silently, because
# the build still succeeds.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = ["prove"]
# The prover, in-process: risc0's client (executor environment, prover
# selection) and its proving circuits. Off, the crate verifies, commits and
# hashes only -- and builds for wasm32, which is what the WASM binding is.
prove = ["risc0-zkvm/client", "risc0-zkvm/prove", "risc0-zkvm/bonsai", "wickra-zk-methods/elf"]

[dependencies]
risc0-zkvm = { workspace = true }
# The image id always; the guest program itself only with the prover.
wickra-zk-methods = { path = "../../guest/methods", version = "0.1.0", default-features = false }
wickra-backtest = { workspace = true }
wickra-proof-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
