[package]
name = "wickra-zk"
description = "Command-line prover and verifier for wickra-zk: prove a backtest inside the zkVM and check the resulting receipt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# docs.rs builds with default features unless told otherwise, so anything behind
# a feature flag is missing from the rendered documentation -- silently, because
# the build still succeeds.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[bin]]
name = "wickra-zk"
path = "src/main.rs"

[dependencies]
wickra-zk-host = { path = "../wickra-zk-host", version = "0.1.0" }
clap = { workspace = true }
serde_json = { workspace = true }
