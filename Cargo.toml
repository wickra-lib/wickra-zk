[workspace]
resolver = "2"
members = [
    "crates/wickra-zk-host",
    "crates/wickra-zk-cli",
    "crates/wickra-zk-bench",
    "guest/methods",
]
# NOT members: guest/methods/guest (detached, riscv target, own toolchain)

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-zk"
authors = ["wickra-lib"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
risc0-zkvm = "3.0"
risc0-build = "3.0"
# Pinned to an exact rev, not to a floating branch. An unpinned git dependency
# never goes red -- it only gets older, and then one day the API underneath has
# moved and the build breaks with errors that look like your own. That is how
# the guest came to call `wickra_proof_core::hash_candles`: it was written against a
# shape of the crate that the branch later left behind. Bump these deliberately.
wickra-backtest = { git = "https://github.com/wickra-lib/wickra-backtest", rev = "d58e357506dbb95211d2313eae7bae93d1f73777", version = "0.1" }
wickra-proof-core = { git = "https://github.com/wickra-lib/wickra-proof", rev = "971a41b26512807fdbd37b3f1da4a9b0689a77d0", version = "0.1" }
# codspeed-criterion-compat is a drop-in for criterion: the benches keep their
# criterion API and run as criterion locally, but under `cargo codspeed` they
# report measurements instead of merely executing. Without the alias the
# CodSpeed job runs the benchmarks, uploads nothing, and passes.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1" }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
# NOTE: NO panic="abort" here — risc0 host proving relies on unwinding; guest has its own profile.
