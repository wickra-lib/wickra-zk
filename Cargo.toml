[workspace]
resolver = "2"
members = ["bindings/c", "bindings/python", "bindings/node", 
    "crates/wickra-zk-host",
    "crates/wickra-zk-cli",
    "crates/wickra-zk-bench",
    "guest/methods",
    "examples/rust",
]
# NOT members: guest/methods/guest (detached, riscv target, own toolchain) and
# guest/builder (the one crate that needs risc0-build; it writes the committed
# ELF + image id into guest/methods).
# cargo-fuzz builds fuzz/ on its own, with sanitizer flags the workspace must
# not inherit, so it is excluded rather than a member; the same goes for the
# guest and the builder, which carry their own [workspace] tables.
exclude = ["fuzz", "guest/methods/guest", "guest/builder"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra-zk"
authors = ["wickra-lib"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the correctly rounded float parser, so a candle or a strategy
# parameter re-parses to the value that was printed and the canonical hashes
# are hashes of the text. wickra-proof-core already requires the feature and
# cargo unifies it across the graph; stating it here keeps that a decision of
# this workspace rather than a side effect of the engine's manifest.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# Verify-only by default: receipts, journals and `Receipt::verify`, which
# build for every target including wasm32. The host's `prove` feature (on by
# default) adds risc0's client and its in-process prover on top. Without the
# in-process prover risc0 runs `r0vm` as a subprocess -- for dev-mode receipts
# too -- so every crate, wheel and native package would need the risc0
# toolchain installed beside it; with it, a `pip install` or a
# `cargo install` is the whole prover.
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }
# Pinned to exact published releases. They were git revs while the siblings
# were unreleased; a git rev never goes red, it only gets older, and cargo
# treats "this git URL at rev X" and the registry as different sources, so a
# consumer resolving the same crate from the registry ends up with two copies
# of wickra-backtest-core in one graph, and two copies do not share a
# BacktestReport or a Candle. The two pins must agree with each other:
# wickra-proof-core 0.1.2 requires wickra-backtest-core =0.1.4, so the engine
# facade is 0.1.4 here. Move them together, and the guest manifest with them
# (guest/methods/guest/Cargo.toml) -- a different guest source is a different
# image id, and the committed ELF, id and real receipt then move too.
wickra-backtest = "=0.1.7"
wickra-proof-core = "=0.1.3"
# codspeed-criterion-compat is a drop-in for criterion: the benches keep their
# criterion API and run as criterion locally, but under `cargo codspeed` they
# report measurements instead of merely executing. Without the alias the
# CodSpeed job runs the benchmarks, uploads nothing, and passes.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1" }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
# NOTE: NO panic="abort" here — risc0 host proving relies on unwinding; guest has its own profile.
