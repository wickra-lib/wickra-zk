name: Setup risc0 zkVM toolchain
description: >
  Install the risc0 toolchain (rzup, the r0vm executor and the guest Rust
  toolchain) at a pinned version, restoring the ~/.risc0 cache when possible so
  the multi-hundred-megabyte toolchain is downloaded at most once per version.
  The version is pinned to match the risc0-zkvm / risc0-build crate version in
  the workspace (an ImageID/Receipt mismatch results otherwise).

  Nothing is added to PATH: risc0-build and `cargo +risc0` find the toolchain
  under ~/.risc0 on their own, and a step that runs `r0vm` puts
  "$HOME/.risc0/bin" on its own PATH.

inputs:
  version:
    description: risc0 toolchain version to install (must match the risc0-zkvm crate).
    required: false
    default: "3.0.6"

runs:
  using: composite
  steps:
    - name: Restore the risc0 toolchain cache
      id: cache
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ~/.risc0
        key: risc0-${{ runner.os }}-${{ inputs.version }}

    - name: Install rzup
      shell: bash
      run: curl -L https://risczero.com/install | bash

    # rzup resolves each component through the GitHub releases API. Without a
    # token that is the runner's shared, unauthenticated quota, and a busy hour
    # ends the job with "API rate limit exceeded" before anything is built.
    # The version arrives through the environment, not template expansion, so
    # no input can become shell.
    - name: Install the pinned risc0 toolchain
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RISC0_VERSION: ${{ inputs.version }}
      run: |
        export PATH="$HOME/.risc0/bin:$PATH"
        rzup install cargo-risczero "$RISC0_VERSION"
        rzup install rust
        rzup install r0vm "$RISC0_VERSION"

    - name: Report the installed toolchain
      shell: bash
      run: |
        export PATH="$HOME/.risc0/bin:$PATH"
        rzup show || true
        r0vm --version || true
