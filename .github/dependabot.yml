version: 2
# Version updates run normally. They were paused with limit 0 while the zkVM
# guest did not compile -- no dependabot PR could go green against a guest that
# failed to build, so every one of them would have been noise. The guest builds
# now, so the pause has outlived its reason.
#
# Note what the pause also did while it lasted: `open-pull-requests-limit: 10`
# suppresses security updates too, not only version updates. A repository can
# sit unaware of a critical advisory that way, which is close to what happened
# here -- the risc0-zkvm arbitrary-code-execution advisory was found by reading
# the alert list, not by a PR arriving.
updates:
  # Rust host workspace (root Cargo.toml + all member crates). The guest crate
  # under guest/methods/guest is a detached riscv build and is updated manually
  # in lock-step with the host risc0 version.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    groups:
      # risc0-zkvm / risc0-build must move together and stay identical across
      # host, methods and guest (an ImageID/Receipt mismatch otherwise); keep
      # them in their own PR rather than bundled with unrelated crate bumps.
      risc0:
        patterns: ["risc0-zkvm", "risc0-build", "risc0-*"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["risc0-zkvm", "risc0-build", "risc0-*"]

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads
  # the version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    # dtolnay/rust-toolchain@<channel> pins a Rust toolchain (e.g. 1.90 for the
    # MSRV job), not an action version. Dependabot misreads the channel as a
    # version and proposes non-existent Rust releases. The toolchain pins are
    # managed manually with the MSRV policy.
    # No ignore list. Every action here is pinned by commit SHA, so dependabot
    # cannot misread a version, and an ignore would silence its security
    # updates as well as its version ones.
    groups:
      github-actions:
        patterns: ["*"]

  # The fuzz targets have their own lockfile and their own dependency graph;
    # nothing in the workspace update reaches them.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      fuzz-deps:
        patterns: ["*"]

  # The Python binding's own build and test dependencies.
  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-binding:
        patterns: ["*"]

  # The Java binding: JUnit and the publishing plugins.
  - package-ecosystem: maven
    directory: "/bindings/java"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(maven)"
    groups:
      maven:
        patterns: ["*"]

  # The C# test project.
  - package-ecosystem: nuget
    directory: "/bindings/csharp/WickraZk.Tests"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(nuget)"
    groups:
      nuget:
        patterns: ["*"]

  # The Go module that mirrors out to wickra-zk-go.
  - package-ecosystem: gomod
    directory: "/bindings/go"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-binding:
        patterns: ["*"]

  # The Node binding and the napi CLI that generates its loader.
  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-binding:
        patterns: ["*"]

  # The hash-pinned CI requirements; they only move when something regenerates them.
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(pip)"
    groups:
      ci-requirements:
        patterns: ["*"]
