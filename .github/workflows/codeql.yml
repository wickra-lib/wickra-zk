name: CodeQL

# Static analysis security testing. Analyses the Rust core and the Python /
# JavaScript binding surfaces with GitHub's CodeQL engine. Results appear under
# Security → Code scanning. `build-mode: none` analyses source directly — no
# compilation step — for every language here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 0' # Sundays 03:31 UTC

# Least-privilege default for the auto-injected GITHUB_TOKEN. The analyze job
# raises exactly the scopes CodeQL needs (security-events: write to upload
# results) in its own job-level block below; this top-level read-only default
# covers any future job (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

env:
  # risc0's circuits are C++ kernels compiled by build scripts, and one of
  # them, risc0-circuit-keccak-sys, is a single generated file that g++ 13
  # takes 11 minutes to optimise on a desktop core (25 on a runner core) and
  # clang 18 takes 19 seconds. Every other crate compiles in under a minute.
  # The runners ship both compilers; this picks the one that finishes.
  # Apple's default compiler is clang already, so macOS jobs were never slow.
  CC: clang
  CXX: clang++

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90 # the go and c-cpp rows build the prover's C ABI in release: ~30 min cold
    permissions:
      security-events: write # upload CodeQL results to code-scanning
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: c-cpp
            build-mode: manual
          - language: csharp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # `manual` build mode means this workflow owns producing the compiled
      # artefacts CodeQL analyses. A language in the matrix with no build is a
      # check that reports success over an empty database.
      - name: Install Rust toolchain
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        uses: ./.github/actions/setup-rust
      - name: Restore the release build cache the CI jobs share
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
      - name: Build the C ABI library
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        run: cargo build -p wickra-zk-c --release
      - name: Stage the native library for cgo
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra_zk.so bindings/go/lib/linux_amd64/
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The C ABI is Rust; what CodeQL sees for c-cpp is the C and C++ that
      # consume it, compiled after init so the tracer records them.
      - name: Build the C and C++ examples
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
      - name: Build the C# binding and tests
        if: matrix.language == 'csharp'
        run: dotnet build bindings/csharp/WickraZk.Tests/WickraZk.Tests.csproj -c Release
      - name: Build the Java binding
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f bindings/java install -DskipTests
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
