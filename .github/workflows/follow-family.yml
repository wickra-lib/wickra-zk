name: Follow the family

# When a wickra-* crate this repository depends on is released, move the lock
# (and any exact pin) to it and open a pull request that merges itself once the
# required checks pass. The release happens in another repository, so a daily
# schedule is what notices it -- the same pull model as the sites'
# sync-from-*.yml. Nothing crosses a major or a 0.x minor; that stays a
# person's change. The logic is wickra-lib/.github's actions/follow-family; the
# wickra-lib-bot token signs the commit and, unlike GITHUB_TOKEN, starts the
# pull request's CI and main's workflows after the merge.
# This repository merges such updates by hand: the pull request is labelled
# `manual` instead of merging itself (the guest lock is part of the committed
# guest image, whose rebuild and re-proved receipt follow by hand).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: follow-family
  cancel-in-progress: false

jobs:
  follow:
    name: Follow family releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint a wickra-lib-bot token for this repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WICKRA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WICKRA_BOT_PRIVATE_KEY }}
          permission-contents: write
          # pull-requests: write also creates and applies the `manual` label on
          # the pull request; the app holds no Issues permission to request.
          permission-pull-requests: write
      - name: Move to new family releases
        uses: wickra-lib/.github/actions/follow-family@da1bd395c27f33dbed632c8e4e48e12f85394858 # v1.1.0
        with:
          token: ${{ steps.app.outputs.token }}
          locks: ". bindings/wasm guest/methods/guest"
          automerge: "false"
