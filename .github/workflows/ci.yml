name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The host workspace embeds the guest ELF via `risc0_build::embed_methods()`, so
# every job that builds host/cli/bench needs the risc0 toolchain (Linux/macOS
# only — risc0 does not ship a Windows target). Tests run under RISC0_DEV_MODE=1
# for a fast, unsound receipt; the real proving path is exercised nightly in
# prove.yml.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-host:
    name: Clippy (host)
    runs-on: ubuntu-latest
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy-guest:
    name: Clippy (guest, riscv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy the guest for the zkVM target
        working-directory: guest/methods/guest
        run: cargo clippy --target riscv32im-risc0-zkvm-elf -- -D warnings

  guest-build:
    name: Guest build (ELF + image id)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Building the methods crate compiles the guest to a RISC-V ELF and
      # generates WICKRA_ZK_GUEST_ELF / WICKRA_ZK_GUEST_ID.
      - run: cargo build -p wickra-zk-methods

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # risc0 has no Windows target
    runs-on: ${{ matrix.os }}
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --workspace

  coverage:
    name: Coverage (host, dev-mode)
    runs-on: ubuntu-latest
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-risc0
      - uses: taiki-e/install-action@6f1af7f89f8c1a5cb7dcb85d7853c05e7c3d4783 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov -p wickra-zk-host --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check advisories bans sources licenses

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: ./.github/actions/setup-risc0
      - uses: taiki-e/install-action@6f1af7f89f8c1a5cb7dcb85d7853c05e7c3d4783 # cargo-fuzz
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz build
        working-directory: .
      - run: |
          for target in zkspec_parse journal_parse; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30
          done

  golden:
    name: Golden hash chain (dev-mode)
    runs-on: ubuntu-latest
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p wickra-zk-host --test golden

  cli-roundtrip:
    name: CLI roundtrip (dev-mode)
    runs-on: ubuntu-latest
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Prove then verify a golden case end to end
        run: |
          cargo run -p wickra-zk -- prove \
            --spec golden/specs/momentum.json \
            --data golden/data/sym-01.csv \
            --out proof.json --dev
          cargo run -p wickra-zk -- verify --proof proof.json | tee out.json
          grep -q '"verified": true' out.json
