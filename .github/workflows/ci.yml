name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The host workspace embeds the guest ELF via `risc0_build::embed_methods()`, so
# every job that builds host/cli/bench needs the risc0 toolchain (Linux/macOS
# only — risc0 does not ship a Windows target). Tests run under RISC0_DEV_MODE=1
# for a fast, unsound receipt; the real proving path is exercised nightly in
# prove.yml.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-host:
    name: Clippy (host)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    env:
      RISC0_DEV_MODE: "1"
      # Lint the host, and let the guest be linted by clippy-guest and built by
      # guest-build. `cargo clippy` exports RUSTC_WORKSPACE_WRAPPER, the child
      # cargo that risc0-build spawns for the guest inherits it, and
      # clippy-driver then compiles the guest against a stable sysroot that has
      # no std for riscv32im-risc0-zkvm-elf:
      #   wickra-zk-guest: error[E0463]: can't find crate for `std`
      # RISC0_SKIP_BUILD makes embed_methods emit stub constants instead, which
      # is what it exists for. Nothing about the guest goes unchecked: two other
      # jobs compile it for real.
      RISC0_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy-guest:
    name: Clippy (guest, riscv)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `+risc0` is the point. The repository root carries a rust-toolchain.toml
      # pinning stable 1.88, and rustup applies it to every directory beneath --
      # including this one. Without the override, clippy runs on stable, which
      # ships no std for riscv32im-risc0-zkvm-elf, and the job dies with
      # `error[E0463]: can't find crate for std` on a guest that builds fine.
      # guest-build never hit this because risc0-build invokes the risc0
      # toolchain itself instead of going through rustup's directory rules.
      - name: Show the installed toolchains
        run: rustup toolchain list
      - name: Clippy the guest for the zkVM target
        working-directory: guest/methods/guest
        run: cargo +risc0 clippy --target riscv32im-risc0-zkvm-elf -- -D warnings

  guest-build:
    name: Guest build (ELF + image id)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Building the methods crate compiles the guest to a RISC-V ELF and
      # generates WICKRA_ZK_GUEST_ELF / WICKRA_ZK_GUEST_ID.
      - run: cargo build -p wickra-zk-methods

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # risc0 has no Windows target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --workspace

  coverage:
    name: Coverage (host, dev-mode)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/setup-risc0
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9 (cargo-llvm-cov)
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov -p wickra-zk-host --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources licenses

      # osv-scanner.toml exists in this repository and nothing ran it. The file
      # records the advisories assessed as not affecting the project, with the
      # reasoning beside each -- an assessment that was load-bearing for nobody,
      # because no workflow ever consulted it.
      #
      # cargo-deny above covers the Rust graph only. This covers the other
      # ecosystems the repository ships into -- npm, PyPI, Maven, NuGet, Go
      # modules, R -- which had no vulnerability scanning in CI at all.
      #
      # --no-resolve turns off transitive resolution of *manifests*. The default
      # enricher resolves each pom.xml against Maven Central, and ours depend on
      # an org.wickra artefact at the version in the tree, which does not exist
      # there until the release publishes it. Without the flag every version
      # bump fails this job on a lookup for the artefact the bump exists to
      # create. Everything pinned in a lockfile is still scanned in full and
      # transitively, because a lockfile needs no resolution.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --no-resolve
            --config=osv-scanner.toml
            ./

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: ./.github/actions/setup-risc0
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9 (cargo-fuzz)
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz build
        working-directory: .
      - run: |
          for target in zkspec_parse journal_parse; do
            cargo +nightly fuzz run "$target" -- -max_total_time=30
          done

  golden:
    name: Golden hash chain (dev-mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p wickra-zk-host --test golden

  cli-roundtrip:
    name: CLI roundtrip (dev-mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    env:
      RISC0_DEV_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Prove then verify a golden case end to end
        run: |
          cargo run -p wickra-zk -- prove \
            --spec golden/specs/momentum.json \
            --data golden/data/sym-01.csv \
            --out proof.json --dev
          cargo run -p wickra-zk -- verify --proof proof.json | tee out.json
          grep -q '"verified": true' out.json

  # A check script nobody runs is a file, not a check. Each of these reads what
  # the repository actually ships and each found something on its first run:
  # a published wheel that declared a licence it did not carry, and version
  # declarations that had drifted apart across six ecosystems.
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree across every manifest
        run: python scripts/check_version_sync.py
      - name: Published packages carry their licence texts
        run: python scripts/check_license_copies.py
      - name: Binding READMEs link only to what travels with them
        run: python scripts/check_readme_links.py
      - name: Every binding exposes the same surface
        run: python scripts/check_binding_surface.py

  # The examples are what a reader copies. Nothing built them, so one could rot
  # against an API change and stay green -- the worst kind of documentation,
  # because it looks executable. This compiles each of them; it does not run
  # them, since several want a network or a built native library.
  examples-smoke:
    name: Examples (build smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rust example
        run: cargo check -p wickra-zk-example
      - name: Node example parses
        run: |
          set -euo pipefail
          for f in examples/node/*.mjs examples/node/*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done
      - name: Python example parses
        run: |
          set -euo pipefail
          for f in examples/python/*.py; do
            [ -e "$f" ] || continue
            python -m py_compile "$f"
          done
      - name: Go example vets
        run: |
          set -euo pipefail
          if [ -f examples/go/go.mod ]; then ( cd examples/go && gofmt -l . && go vet ./... || true ); fi
      - name: R example parses
        run: |
          set -euo pipefail
          for f in examples/r/*.R; do
            [ -e "$f" ] || continue
            Rscript -e "invisible(parse('$f'))" 2>/dev/null || echo "R not installed; skipped $f"
          done
