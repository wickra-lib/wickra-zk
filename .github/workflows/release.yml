name: Release

# USER-GO / HARD-STOP: this runs only on a pushed `v*` tag and performs the
# irreversible crates.io publish. Never tag without explicit approval.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release + upload assets
  id-token: write # SLSA build provenance attestation

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # Host first, then the CLI that depends on it.
      - name: Publish wickra-zk-host
        run: cargo publish -p wickra-zk-host
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish wickra-zk (CLI)
        run: cargo publish -p wickra-zk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  guest-artifact:
    name: Guest ELF + image id
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The guest ELF and its image id are committed under guest/methods and
      # rebuilt reproducibly by the guest-build job on every push; export the
      # image id so anyone can pin the exact program a receipt is verified
      # against.
      - name: Export the image id
        run: cargo run -p wickra-zk -- version > guest-image-id.json
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: guest-image-id.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          generate_release_notes: true
          files: |
            guest-image-id.json
            sbom.cyclonedx.json
