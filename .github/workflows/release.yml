name: Release

# USER-GO / HARD-STOP: this runs only on a pushed `v*` tag and performs the
# irreversible crates.io publish. Never tag without explicit approval.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release + upload assets
  id-token: write # SLSA build provenance attestation

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      # Host first, then the CLI that depends on it.
      - name: Publish wickra-zk-host
        run: cargo publish -p wickra-zk-host
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish wickra-zk (CLI)
        run: cargo publish -p wickra-zk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  guest-artifact:
    name: Guest ELF + image id
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      # Build the guest and export the ELF + image id so anyone can reproduce
      # the exact program a receipt is verified against.
      - name: Build guest and export image id
        run: |
          cargo build -p wickra-zk-methods --release
          cargo run -p wickra-zk -- version > guest-image-id.json
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: guest-image-id.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            guest-image-id.json
            sbom.cyclonedx.json
