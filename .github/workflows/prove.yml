name: Prove (nightly)

# Real (non dev-mode) proving is slow and memory-hungry, so the sound end-to-end
# roundtrip runs nightly rather than on every push.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  # risc0's circuits are C++ kernels compiled by build scripts, and one of
  # them, risc0-circuit-keccak-sys, is a single generated file that g++ 13
  # takes 11 minutes to optimise on a desktop core (25 on a runner core) and
  # clang 18 takes 19 seconds. Every other crate compiles in under a minute.
  # The runners ship both compilers; this picks the one that finishes.
  # Apple's default compiler is clang already, so macOS jobs were never slow.
  CC: clang
  CXX: clang++

jobs:
  prod-roundtrip:
    name: Real prove/verify roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # No RISC0_DEV_MODE: a real, sound receipt. The #[ignore]d test asserts the
      # production journal matches the blessed expected report hash. The prover
      # is in-process (risc0-zkvm's `prove` feature), so no toolchain is set up.
      - name: Prove for real and verify
        run: cargo test -p wickra-zk-host prod_roundtrip -- --ignored --nocapture
