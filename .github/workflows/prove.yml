name: Prove (nightly)

# Real (non dev-mode) proving is slow and memory-hungry, so the sound end-to-end
# roundtrip runs nightly rather than on every push.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-roundtrip:
    name: Real prove/verify roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-risc0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # No RISC0_DEV_MODE: a real, sound receipt. The #[ignore]d test asserts the
      # production journal matches the blessed expected report hash.
      - run: cargo test -p wickra-zk-host prod_roundtrip -- --ignored --nocapture
