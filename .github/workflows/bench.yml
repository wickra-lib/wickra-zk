name: Bench (nightly)

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io inside the build retries automatically
  # instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # risc0's circuits are C++ kernels compiled by build scripts, and one of
  # them, risc0-circuit-keccak-sys, is a single generated file that g++ 13
  # takes 11 minutes to optimise on a desktop core (25 on a runner core) and
  # clang 18 takes 19 seconds. Every other crate compiles in under a minute.
  # The runners ship both compilers; this picks the one that finishes.
  # Apple's default compiler is clang already, so macOS jobs were never slow.
  CC: clang
  CXX: clang++

jobs:
  criterion:
    name: Criterion (exec vs prod)
    runs-on: ubuntu-latest
    # Real proving: Criterion's minimum of ten samples at roughly fourteen
    # minutes a proof, plus one warm-up proof and one for the verify bench,
    # is close to three hours. The two-hour budget the rest of the family
    # uses cancelled every nightly run; six hours is the runner's maximum.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # exec/* runs in dev-mode; prove/* runs a real proof (WICKRA_ZK_BENCH_PROD).
      # Numbers are transcribed into BENCHMARKS.md.
      - name: Run benchmarks
        env:
          WICKRA_ZK_BENCH_PROD: "1"
        run: cargo bench -p wickra-zk-bench
