name: wickra-zk CodeQL configuration
paths-ignore:
  # napi-derive's expansion, not this file. The exported `#[napi]` class
  # raises one `rust/access-invalid-pointer` anchored on its `pub struct` line,
  # while the file itself contains no `unsafe` at all -- the dereference the
  # rule sees lives in the macro, and CodeQL attributes it back to the macro's
  # source span. Giving the struct a field changed nothing; the rule can say
  # nothing true about the file, so nothing is lost by excluding it.
  #
  # By path rather than by disabling the query: `query-filters` match on id,
  # tags and severity and cannot be scoped, so switching the rule off would
  # also switch it off for `bindings/c/src`, which is where the real raw-pointer
  # code lives and where it earns its place.
  - bindings/node/src/lib.rs
  # Generated by `napi build` and committed so the package can be published
  # without a build step. Regenerating them is the fix for anything found here.
  - bindings/node/index.js
  - bindings/node/index.d.ts
  # A vendored copy of the C ABI header, kept in sync by
  # .github/scripts/check-cbindgen.sh rather than edited.
  - bindings/go/include
  # Generated by guest/builder from the guest source: the compiled guest and
  # its image id. The source it comes from, guest/methods/guest, is analysed.
  - guest/methods/elf
  - guest/methods/src/guest_id.rs
  # Fixtures, not code: the committed cases and expected journals.
  - golden
  # Build output and dependency trees.
  - target
  - "**/node_modules"
paths:
  - bindings
  - crates
  - examples
  - fuzz
  - guest
