[package]
name = "wickra-zk-methods"
description = "The compiled wickra-zk guest program: the RISC-V ELF the prover runs and the image id the verifier pins, committed alongside the source that produces them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# What ships is what is committed: the guest ELF under elf/ and the generated
# image id in src/guest_id.rs. Both are produced by ../builder, the one crate
# that needs the risc0 toolchain, and regenerated in CI with RISC0_USE_DOCKER=1
# so a diff against the committed bytes proves the source and the artefact
# agree. This crate itself builds with plain Rust anywhere, docs.rs included.
include = ["src/**", "elf/**", "LICENSE-*"]

[lints]
workspace = true
