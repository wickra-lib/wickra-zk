[package]
name = "wickra-zk-methods"
description = "risc0 build wrapper: compiles the wickra-zk guest program to a RISC-V ELF and exposes its ELF bytes and image ID to the host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# risc0-build's embed_methods() reads this to locate the guest crate(s): each
# entry is a path (relative to this manifest) to a RISC-V guest package. Without
# it, risc0-build panics (Risc0Metadata::from_package -> None) and the guest ELF
# build fails.
[package.metadata.risc0]
methods = ["guest"]

[lints]
workspace = true

# The methods crate carries no runtime logic of its own: build.rs invokes
# `risc0_build::embed_methods()`, which builds `guest/` (the detached RISC-V
# crate) and generates `$OUT_DIR/methods.rs` with `WICKRA_ZK_GUEST_ELF` and
# `WICKRA_ZK_GUEST_ID`. `src/lib.rs` only re-includes that generated file.
[build-dependencies]
risc0-build = { workspace = true }
