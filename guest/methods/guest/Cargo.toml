# Detached guest crate — built for `riscv32im-risc0-zkvm-elf` by
# `wickra-zk-methods`'s build.rs, NOT a member of the host workspace. The empty
# `[workspace]` table below makes this its own workspace root so the host's
# root Cargo.toml never pulls it into the native build graph.
[workspace]

[package]
name = "wickra-zk-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "wickra-zk-guest"
path = "src/main.rs"

[dependencies]
# risc0 guest runtime. `std` here is risc0's guest std shim (no host OS), the
# risc0 convention — it provides `env::read`/`env::commit` and the entry macro.
risc0-zkvm = { version = "1.2", default-features = false, features = ["std"] }

# The engine and the hasher. Both build for riscv32im-risc0-zkvm-elf as they
# are: risc0's guest std shim carries what they use -- VecDeque, BTreeMap, the
# float math, serde and schemars -- so no no_std conversion is required upstream
# and none is waited on here.
#
# `default-features = false` is not what makes that work; it is asked for so the
# guest does not drag rayon in behind wickra-core. rayon compiles for the guest,
# but a thread pool in a single-threaded zkVM is cycles paid for nothing. Note
# it currently has no effect: wickra-backtest-core declares no [features] and so
# forwards nothing to wickra-core. Fixing that lives upstream.
#
# Pinned to an exact rev for the reason given in the workspace manifest.
wickra-backtest = { git = "https://github.com/wickra-lib/wickra-backtest", rev = "d58e357506dbb95211d2313eae7bae93d1f73777", version = "0.1", default-features = false }
proof-core = { git = "https://github.com/wickra-lib/wickra-proof", rev = "574284dc2e27535b57ea3d8aa1b8510da7d30658", version = "0.1", default-features = false }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
